<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound</title>
    <style>
        /* --- DESIGN SYSTEM (PAPER & INK EDITORIAL) --- */
        @font-face { font-family: 'TanPearl'; src: url('./TanPearl.otf'); }

        :root {
            --bg-paper: #F9F9F7;    
            --ink-black: #1A1A1A;   
            --ink-faded: #888888;
            --border: rgba(0,0,0,0.1);
            --item-active: rgba(0,0,0,0.04);
            --accent-gold: #B5952F;
            --accent-red: #A33B3B;
            
            --font-serif: 'TanPearl', serif; 
            --font-mono: 'Segoe UI', monospace;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        body.dark-mode { 
            --bg-paper: #111111; 
            --ink-black: #E0E0E0; 
            --ink-faded: #777777;
            --item-active: rgba(255,255,255,0.05); 
            --border: rgba(255,255,255,0.1); 
            --accent-red: #D65A5A;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; background-color: var(--bg-paper); color: var(--ink-black);
            font-family: var(--font-mono); height: 100dvh; display: flex;
            flex-direction: column; overflow: hidden; 
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- HEADER --- */
        header {
            padding: 18px 20px; padding-top: calc(18px + var(--safe-top));
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
            z-index: 10;
        }
        .header-title { font-family: var(--font-serif); font-size: 24px; letter-spacing: -0.5px; }
        .header-actions { display: flex; gap: 16px; align-items: center; }
        
        .icon-btn { 
            background: none; border: none; padding: 0; cursor: pointer; 
            color: var(--ink-black); display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
        }
        .icon-btn:active { transform: scale(0.9); }
        .icon-btn.active { opacity: 1; color: var(--accent-gold); }

        .icon-moon { display: block; }
        .icon-sun { display: none; }
        body.dark-mode .icon-moon { display: none; }
        body.dark-mode .icon-sun { display: block; }

        /* --- MAIN STAGE (FOCUS PLAYER) --- */
        .player-stage {
            flex-grow: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 25px 20px;
            overflow-y: auto; text-align: center;
        }

        .art-frame-wrapper {
            position: relative; width: 220px; height: 220px; margin-bottom: 25px;
        }
        .art-frame {
            width: 220px; height: 220px; border: 1px solid var(--ink-black);
            background: var(--item-active); border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); overflow: hidden; position: relative; z-index: 2;
        }
        .art-frame img { width: 100%; height: 100%; object-fit: cover; }

        .specs-row { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; }
        .spec-badge {
            font-size: 8px; text-transform: uppercase; letter-spacing: 1.5px;
            border: 1px solid var(--border); padding: 3px 7px; border-radius: 2px;
            opacity: 0.5; font-weight: bold;
        }

        .track-title { 
            font-family: var(--font-serif); font-size: 22px; margin-bottom: 6px; 
            max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.2;
        }
        .track-artist { 
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px; 
            opacity: 0.6; margin-bottom: 25px; max-width: 280px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .scrubber-container { width: 100%; max-width: 320px; margin-bottom: 25px; }
        .time-readout { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.5; margin-top: 8px; font-weight: bold; }
        .progress-track { 
            width: 100%; height: 6px; background: var(--border); border-radius: 3px; 
            cursor: pointer; position: relative; overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--ink-black); width: 0%; border-radius: 3px; transition: width 0.1s linear; }

        .controls-row { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        .play-btn { 
            width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--ink-black);
            display: flex; align-items: center; justify-content: center; background: var(--bg-paper);
            font-size: 18px; cursor: pointer; transition: transform 0.2s, background-color 0.2s;
        }
        .play-btn:active { transform: scale(0.92); background: var(--item-active); }

        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav {
            border-top: 1px solid var(--border); padding: 12px 20px;
            padding-bottom: calc(12px + var(--safe-bottom));
            display: flex; justify-content: space-around; align-items: center;
            background: var(--bg-paper); flex-shrink: 0; z-index: 10;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
            color: var(--ink-faded); background: none; border: none; cursor: pointer;
            font-family: var(--font-mono); font-weight: bold;
        }
        .nav-item.active { color: var(--ink-black); }

        /* --- SLIDING DRAWER OVERLAY --- */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-paper); z-index: 500; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding-top: var(--safe-top);
        }
        .drawer-overlay.open { transform: translateY(0); }

        .drawer-header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .drawer-tabs { display: flex; gap: 15px; overflow-x: auto; border-bottom: 1px solid var(--border); padding: 0 20px; flex-shrink: 0; }
        .drawer-tab-btn {
            padding: 12px 0; background: none; border: none; font-family: var(--font-serif);
            font-size: 16px; color: var(--ink-faded); cursor: pointer; border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .drawer-tab-btn.active { color: var(--ink-black); border-bottom-color: var(--ink-black); }

        .drawer-content { flex-grow: 1; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }

        /* --- INPUT & BUTTON MODULES --- */
        .search-box-group { display: flex; gap: 8px; margin-bottom: 20px; }
        .native-input {
            flex-grow: 1; padding: 12px; background: var(--item-active); border: 1px solid var(--border);
            color: var(--ink-black); border-radius: 4px; font-family: var(--font-mono); font-size: 12px; outline: none; width: 100%;
        }
        .btn-panel {
            background: var(--ink-black); color: var(--bg-paper); border: none;
            padding: 12px 18px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; border-radius: 4px; font-weight: bold;
        }
        .btn-panel.outline { background: transparent; border: 1px solid var(--ink-black); color: var(--ink-black); }

        /* --- TRACK ROW & CARD COMPONENTS --- */
        .track-row-item {
            padding: 12px 0; border-bottom: 1px dashed var(--border); display: flex;
            justify-content: space-between; align-items: center; cursor: pointer;
        }
        .track-row-item:active { background: var(--item-active); }
        .track-info-left { display: flex; align-items: center; gap: 12px; flex-grow: 1; overflow: hidden; }
        .track-thumb { width: 44px; height: 44px; border-radius: 3px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); }
        .track-text-group { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .track-row-title { font-size: 13px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-row-artist { font-size: 10px; opacity: 0.5; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-row-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-left: 10px; }

        .playlist-card {
            padding: 16px; border: 1px solid var(--border); background: var(--item-active);
            border-radius: 6px; margin-bottom: 12px; cursor: pointer; transition: transform 0.2s;
        }
        .playlist-card:active { transform: scale(0.99); }
        .pl-card-title { font-family: var(--font-serif); font-size: 18px; margin-bottom: 4px; }
        .pl-card-desc { font-size: 11px; opacity: 0.6; line-height: 1.4; margin-bottom: 10px; }
        .pl-card-meta { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; font-weight: bold; }

        .reorder-btn {
            background: none; border: 1px solid var(--border); border-radius: 3px;
            color: var(--ink-black); font-size: 10px; padding: 4px 6px; cursor: pointer;
        }

        /* --- MODAL SHEETS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000; display: none;
            align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-sheet {
            background: var(--bg-paper); width: 100%; max-width: 500px; border-radius: 12px 12px 0 0;
            padding: 25px 20px calc(25px + var(--safe-bottom)) 20px; border-top: 1px solid var(--border);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); max-height: 80vh; overflow-y: auto;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-track-header { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; border-bottom: 1px dashed var(--border); padding-bottom: 15px; }
        .modal-option-btn {
            width: 100%; padding: 14px 0; background: none; border: none; border-bottom: 1px solid var(--border);
            color: var(--ink-black); font-family: var(--font-mono); font-size: 13px; text-align: left;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }

        #yt-player-hidden { position: absolute; top: -9999px; left: -9999px; width: 200px; height: 200px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-title">Sound</div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleLikeCurrent()" id="header-like-btn" aria-label="Star Track">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </button>
            <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>
    </header>

    <!-- MAIN FOCUS PLAYER STAGE -->
    <div class="player-stage">
        <div class="art-frame-wrapper">
            <div class="art-frame">
                <img id="track-art" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='1'><circle cx='12' cy='12' r='10'/><circle cx='12' cy='12' r='3'/></svg>">
            </div>
        </div>

        <div class="specs-row">
            <span class="spec-badge" id="spec-source">IDLE</span>
            <span class="spec-badge">STEREO</span>
            <span class="spec-badge">44.1 KHZ</span>
        </div>

        <div class="track-title" id="track-title">Sound Engine</div>
        <div class="track-artist" id="track-artist">Search any Track, Artist or Album</div>

        <div class="scrubber-container">
            <div class="progress-track" onclick="seekTrack(event)">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
            <div class="time-readout">
                <span id="time-current">0:00</span>
                <span id="time-total">0:00</span>
            </div>
        </div>

        <div class="controls-row">
            <button class="icon-btn" onclick="toggleShuffle()" id="btn-shuffle" title="Shuffle Mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            </button>
            <button class="icon-btn" onclick="playPrev()" style="font-size: 20px;">⏮</button>
            <button class="play-btn" onclick="togglePlay()" id="btn-play">▶</button>
            <button class="icon-btn" onclick="playNext()" style="font-size: 20px;">⏭</button>
            <button class="icon-btn" onclick="toggleRepeat()" id="btn-repeat" title="Repeat Mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="openDrawerTab('search')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span>Search</span>
        </button>
        <button class="nav-item" onclick="openDrawerTab('queue')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Queue</span>
        </button>
        <button class="nav-item" onclick="openDrawerTab('library')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span>Library</span>
        </button>
        <button class="nav-item" onclick="openDrawerTab('history')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>History</span>
        </button>
    </div>

    <!-- DRAWER OVERLAY -->
    <div id="drawer-overlay" class="drawer-overlay">
        <div class="drawer-header">
            <div class="header-title" id="drawer-title">Explorer</div>
            <button class="icon-btn" onclick="closeDrawer()" style="font-size: 26px; font-family: var(--font-mono);">×</button>
        </div>

        <div class="drawer-tabs">
            <button class="drawer-tab-btn" id="dtab-search" onclick="switchDrawerTab('search')">Search & Discover</button>
            <button class="drawer-tab-btn" id="dtab-queue" onclick="switchDrawerTab('queue')">Active Queue</button>
            <button class="drawer-tab-btn" id="dtab-library" onclick="switchDrawerTab('library')">Playlists & Saved</button>
            <button class="drawer-tab-btn" id="dtab-history" onclick="switchDrawerTab('history')">Play History</button>
        </div>

        <div class="drawer-content" id="drawer-content-root"></div>
    </div>

    <!-- MAIN CONTEXT MENU -->
    <div id="context-modal" class="modal-overlay" onclick="closeContextMenu()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-track-header">
                <img id="modal-art" src="" style="width: 44px; height: 44px; border-radius: 4px; object-fit: cover;">
                <div style="overflow: hidden;">
                    <div id="modal-title" style="font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Track Name</div>
                    <div id="modal-artist" style="font-size: 10px; opacity: 0.5; text-transform: uppercase;">Artist</div>
                </div>
            </div>

            <button class="modal-option-btn" onclick="actionPlayNext()"><span>Play Next in Queue</span> <span>⏭</span></button>
            <button class="modal-option-btn" onclick="actionAddToQueue()"><span>Add to Bottom of Queue</span> <span>➕</span></button>
            <button class="modal-option-btn" onclick="openPlaylistPickerForActiveTrack()"><span>Add to Custom Playlist...</span> <span>📁</span></button>
            <button class="modal-option-btn" onclick="actionToggleLikeModal()"><span id="modal-like-text">Save to Starred Library</span> <span>⭐</span></button>
            <button class="modal-option-btn" onclick="actionCopyLink()"><span>Copy Track Query</span> <span>🔗</span></button>
            <button class="modal-option-btn" id="modal-remove-btn" style="color: var(--accent-red); display: none;" onclick="actionRemoveFromQueue()"><span>Remove from Queue</span> <span>🗑</span></button>
        </div>
    </div>

    <!-- PLAYLIST PICKER MODAL -->
    <div id="playlist-picker-modal" class="modal-overlay" onclick="closePlaylistPicker()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div style="font-family: var(--font-serif); font-size: 18px; margin-bottom: 15px;">Add to Playlist</div>
            <button class="btn-panel outline" style="width: 100%; margin-bottom: 15px;" onclick="openCreatePlaylistModal()">+ Create New Playlist</button>
            <div id="playlist-picker-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <!-- CREATE/EDIT PLAYLIST FORM MODAL -->
    <div id="playlist-form-modal" class="modal-overlay" onclick="closePlaylistFormModal()">
        <div class="modal-sheet" onclick="event.stopPropagation()">
            <div style="font-family: var(--font-serif); font-size: 20px; margin-bottom: 15px;" id="pl-form-title">New Playlist</div>
            <div style="margin-bottom: 12px;">
                <label style="font-size: 10px; text-transform: uppercase; opacity: 0.5; font-weight: bold;">Playlist Title *</label>
                <input type="text" id="inp-pl-name" class="native-input" placeholder="e.g. Late Night Drives" style="margin-top: 4px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="font-size: 10px; text-transform: uppercase; opacity: 0.5; font-weight: bold;">Description (Optional)</label>
                <input type="text" id="inp-pl-desc" class="native-input" placeholder="e.g. Synthwave & atmospheric tracks" style="margin-top: 4px;">
            </div>
            <button class="btn-panel" style="width: 100%;" onclick="submitPlaylistForm()">Save Playlist</button>
        </div>
    </div>

    <!-- HIDDEN YOUTUBE PLAYER -->
    <div id="yt-player-hidden"></div>

<script>
    /* --- STORAGE HELPERS --- */
    function safeGet(key, fallback = []) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch(e) {
            console.warn("Storage reset for:", key);
            return fallback;
        }
    }

    /* --- SYSTEM STATE --- */
    let player = null;
    let isPlaying = false;
    let isShuffle = false;
    let repeatMode = 0; 
    let progressTimer = null;

    let currentQueue = [];
    let currentQueueIndex = -1;
    let activeModalTrack = null;
    let activeModalIndex = -1;

    let likedSongs = safeGet('sound_liked_tracks', []);
    let playHistory = safeGet('sound_play_history', []);
    let customPlaylists = safeGet('sound_custom_playlists', []);

    let editingPlaylistId = null;
    let viewingPlaylistId = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('sound_theme_dark') === 'true') {
            document.body.classList.add('dark-mode');
        }
    });

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('sound_theme_dark', document.body.classList.contains('dark-mode'));
    }

    /* --- YOUTUBE ENGINE --- */
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player-hidden', {
            height: '200', width: '200', videoId: '',
            playerVars: { 'autoplay': 1, 'controls': 0 },
            events: {
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerStateChange(event) {
        const specSource = document.getElementById('spec-source');
        if (event.data == YT.PlayerState.BUFFERING) {
            if (specSource) specSource.innerText = "BUFFERING";
        } else if (event.data == YT.PlayerState.PLAYING) {
            isPlaying = true;
            document.getElementById('btn-play').innerText = "⏸";
            if (specSource) specSource.innerText = "STREAMING";
            clearInterval(progressTimer);
            progressTimer = setInterval(updateProgress, 500);
            syncTrackDetails();
        } else if (event.data == YT.PlayerState.PAUSED) {
            isPlaying = false;
            document.getElementById('btn-play').innerText = "▶";
            if (specSource) specSource.innerText = "PAUSED";
            clearInterval(progressTimer);
        } else if (event.data == YT.PlayerState.ENDED) {
            if (repeatMode === 2) {
                player.playVideo();
            } else {
                playNext();
            }
        }
    }

    function playYouTubeItem(index) {
        if (index < 0 || index >= currentQueue.length) return;
        currentQueueIndex = index;
        const item = currentQueue[index];

        document.getElementById('track-title').innerText = item.title;
        document.getElementById('track-artist').innerText = item.artist;
        document.getElementById('track-art').src = item.thumbnail || (item.id ? `https://img.youtube.com/vi/${item.id}/hqdefault.jpg` : '');
        
        updateHeaderLikeStatus();
        addToHistory(item);

        if (player && typeof player.loadVideoById === 'function') {
            player.loadVideoById(item.id);
            player.playVideo();
        }
    }

    async function resolveAndPlayTrack(index) {
        if (index < 0 || index >= currentQueue.length) return;
        currentQueueIndex = index;
        const item = currentQueue[index];

        document.getElementById('track-title').innerText = item.title;
        document.getElementById('track-artist').innerText = item.artist + " (Matching Audio...)";
        const specSource = document.getElementById('spec-source');
        if (specSource) specSource.innerText = "SEARCHING";

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(item.searchQuery || item.title + " " + item.artist)}`);
            const data = await res.json();
            if (data.results && data.results.length > 0) {
                const matched = data.results[0];
                item.id = matched.id;
                if (!item.thumbnail) item.thumbnail = matched.thumbnail;
                playYouTubeItem(index);
            } else {
                alert("Could not match stream for this track.");
            }
        } catch (e) { console.error(e); }
    }

    function togglePlay() {
        if (!player) return;
        if (currentQueueIndex === -1 && currentQueue.length > 0) {
            playItemInQueue(0); return;
        }
        if (isPlaying) player.pauseVideo(); else player.playVideo();
    }

    function playNext() {
        if (currentQueue.length === 0) return;
        if (isShuffle) {
            const randIdx = Math.floor(Math.random() * currentQueue.length);
            playItemInQueue(randIdx);
            return;
        }
        if (currentQueueIndex + 1 < currentQueue.length) {
            playItemInQueue(currentQueueIndex + 1);
        } else if (repeatMode === 1) {
            playItemInQueue(0);
        }
    }

    function playPrev() {
        if (currentQueue.length === 0) return;
        if (currentQueueIndex > 0) {
            playItemInQueue(currentQueueIndex - 1);
        }
    }

    function playItemInQueue(index) {
        const item = currentQueue[index];
        if (!item) return;
        if (item.id) playYouTubeItem(index);
        else resolveAndPlayTrack(index);
        if (document.getElementById('drawer-overlay').classList.contains('open')) {
            renderActiveQueue();
        }
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        document.getElementById('btn-shuffle').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
        repeatMode = (repeatMode + 1) % 3;
        const btn = document.getElementById('btn-repeat');
        btn.classList.toggle('active', repeatMode > 0);
        btn.setAttribute('title', repeatMode === 2 ? 'Repeat Single Track' : (repeatMode === 1 ? 'Repeat Queue' : 'Repeat Off'));
    }

    function updateProgress() {
        if (!player || !player.getCurrentTime) return;
        const cur = player.getCurrentTime();
        const tot = player.getDuration();
        if (tot > 0) {
            document.getElementById('progress-bar').style.width = `${(cur / tot) * 100}%`;
            document.getElementById('time-current').innerText = formatTime(cur);
            document.getElementById('time-total').innerText = formatTime(tot);
        }
    }

    function seekTrack(event) {
        if (!player || !player.getDuration) return;
        const rect = event.currentTarget.getBoundingClientRect();
        const pct = (event.clientX - rect.left) / rect.width;
        player.seekTo(player.getDuration() * pct, true);
    }

    function formatTime(secs) {
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function syncTrackDetails() {
        if (!player || !player.getVideoData) return;
        const data = player.getVideoData();
        const activeTrack = currentQueue[currentQueueIndex];
        if (data && data.title && (!activeTrack || !activeTrack.thumbnail)) {
            document.getElementById('track-title').innerText = data.title;
            document.getElementById('track-artist').innerText = data.author;
            document.getElementById('track-art').src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
        }
    }

    /* --- DRAWER & NAVIGATION --- */
    function openDrawerTab(tab) {
        document.getElementById('drawer-overlay').classList.add('open');
        switchDrawerTab(tab);
    }

    function closeDrawer() {
        document.getElementById('drawer-overlay').classList.remove('open');
    }

    function switchDrawerTab(tab) {
        document.querySelectorAll('.drawer-tab-btn').forEach(b => b.classList.remove('active'));
        const tabBtn = document.getElementById(`dtab-${tab}`);
        if (tabBtn) tabBtn.classList.add('active');

        const root = document.getElementById('drawer-content-root');
        root.innerHTML = '';
        viewingPlaylistId = null;

        if (tab === 'search') renderSearchTab(root);
        else if (tab === 'queue') renderActiveQueue(root);
        else if (tab === 'library') renderLibrary(root);
        else if (tab === 'history') renderHistory(root);
    }

    /* --- SEARCH TAB --- */
    function renderSearchTab(root) {
        root.innerHTML = `
            <div class="search-box-group">
                <input type="text" id="drawer-search-input" class="native-input" placeholder="Search song title, artist, or YouTube URL...">
                <button class="btn-panel" id="drawer-search-btn" onclick="executeSearch()">SEARCH</button>
            </div>
            <div id="search-results-target">
                <div style="text-align: center; padding: 40px 20px; color: var(--ink-faded); font-size: 11px; font-style: italic;">
                    Search any track across the open music catalog with high-resolution artwork.
                </div>
            </div>
        `;
        const inp = document.getElementById('drawer-search-input');
        inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeSearch(); });
    }

    async function executeSearch() {
        const input = document.getElementById('drawer-search-input');
        if (!input) return;
        const query = input.value.trim();
        if (!query) return;

        const btn = document.getElementById('drawer-search-btn');
        if (btn) btn.innerText = "FETCHING...";

        try {
            const endpoint = `/api/search?q=${encodeURIComponent(query)}`;
            const res = await fetch(endpoint);
            const data = await res.json();
            const target = document.getElementById('search-results-target');
            target.innerHTML = '';

            if (data.results && data.results.length > 0) {
                target.innerHTML = `<div style="font-size: 10px; font-weight: bold; opacity: 0.5; margin-bottom: 15px; text-transform: uppercase;">Tracks Found (${data.results.length})</div>`;
                data.results.forEach((track, i) => {
                    target.appendChild(createTrackRowElement(track, i, () => {
                        currentQueue = [track];
                        playItemInQueue(0);
                    }));
                });
            } else {
                target.innerHTML = `<div style="text-align: center; padding: 30px; font-size: 12px; opacity: 0.5;">No results found. Try different keywords.</div>`;
            }
        } catch (e) {
            alert("Search routing failed. Verify API endpoint.");
        } finally {
            if (btn) btn.innerText = "SEARCH";
        }
    }

    /* --- QUEUE TAB --- */
    function renderActiveQueue(container) {
        const root = container || document.getElementById('drawer-content-root');
        root.innerHTML = '';

        if (currentQueue.length === 0) {
            root.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--ink-faded); font-size: 11px; font-style: italic;">Active Queue Empty. Search or import songs to populate.</div>`;
            return;
        }

        const topBar = document.createElement('div');
        topBar.style.cssText = "display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;";
        topBar.innerHTML = `
            <span style="font-size: 10px; font-weight: bold; opacity: 0.5; text-transform: uppercase;">${currentQueue.length} Tracks in Queue</span>
            <button onclick="clearQueue()" style="background: none; border: none; color: var(--accent-red); font-size: 10px; font-family: var(--font-mono); font-weight: bold; cursor: pointer; text-transform: uppercase;">Clear Queue</button>
        `;
        root.appendChild(topBar);

        currentQueue.forEach((track, i) => {
            const isPlayingThis = (i === currentQueueIndex);
            const row = createTrackRowElement(track, i, () => playItemInQueue(i), isPlayingThis, true);
            root.appendChild(row);
        });
    }

    function clearQueue() {
        if (confirm("Clear active queue?")) {
            currentQueue = [];
            currentQueueIndex = -1;
            renderActiveQueue();
        }
    }

    /* --- LIBRARY & PLAYLISTS TAB --- */
    function renderLibrary(container) {
        const root = container || document.getElementById('drawer-content-root');
        root.innerHTML = '';

        const actionRow = document.createElement('div');
        actionRow.style.cssText = "display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;";
        actionRow.innerHTML = `
            <span style="font-size: 10px; font-weight: bold; opacity: 0.5; text-transform: uppercase;">Playlists & Starred (${customPlaylists.length})</span>
            <button class="btn-panel" style="padding: 6px 12px; font-size: 10px;" onclick="openCreatePlaylistModal()">+ New Playlist</button>
        `;
        root.appendChild(actionRow);

        const starredCard = document.createElement('div');
        starredCard.className = 'playlist-card';
        starredCard.onclick = () => openStarredDetailView();
        starredCard.innerHTML = `
            <div class="pl-card-title">⭐ Starred Songs</div>
            <div class="pl-card-desc">Your curated collection of favorite and saved tracks.</div>
            <div class="pl-card-meta">${likedSongs.length} Tracks</div>
        `;
        root.appendChild(starredCard);

        if (customPlaylists.length === 0) {
            const emptyHint = document.createElement('div');
            emptyHint.style.cssText = "text-align: center; padding: 30px 20px; color: var(--ink-faded); font-size: 11px; font-style: italic; border: 1px dashed var(--border); border-radius: 4px; margin-top: 10px;";
            emptyHint.innerText = "No custom playlists created yet. Create one to organize tracks.";
            root.appendChild(emptyHint);
            return;
        }

        customPlaylists.forEach(pl => {
            const plCard = document.createElement('div');
            plCard.className = 'playlist-card';
            plCard.onclick = () => openPlaylistDetailView(pl.id);
            plCard.innerHTML = `
                <div class="pl-card-title">${pl.name}</div>
                <div class="pl-card-desc">${pl.description || 'No description provided.'}</div>
                <div class="pl-card-meta">${pl.tracks.length} Tracks • Created ${pl.createdDate}</div>
            `;
            root.appendChild(plCard);
        });
    }

    /* --- PLAYLIST DETAIL VIEW --- */
    function openPlaylistDetailView(playlistId) {
        viewingPlaylistId = playlistId;
        const pl = customPlaylists.find(p => p.id === playlistId);
        if (!pl) return;

        const root = document.getElementById('drawer-content-root');
        root.innerHTML = '';

        const header = document.createElement('div');
        header.style.cssText = "border-bottom: 1px dashed var(--border); padding-bottom: 15px; margin-bottom: 20px;";
        header.innerHTML = `
            <button onclick="renderLibrary()" style="background: none; border: none; font-size: 11px; font-family: var(--font-mono); font-weight: bold; cursor: pointer; color: var(--ink-faded); text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 4px;">
                ← Back to Library
            </button>
            <div style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 4px;">${pl.name}</div>
            <div style="font-size: 11px; opacity: 0.6; margin-bottom: 15px;">${pl.description || 'No description.'}</div>
            
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn-panel" style="padding: 8px 14px; font-size: 10px;" onclick="playEntirePlaylist('${pl.id}', false)">▶ Play All</button>
                <button class="btn-panel outline" style="padding: 8px 14px; font-size: 10px;" onclick="playEntirePlaylist('${pl.id}', true)">🔀 Shuffle</button>
                <button class="btn-panel outline" style="padding: 8px 14px; font-size: 10px;" onclick="openEditPlaylistModal('${pl.id}')">✎ Edit Info</button>
                <button class="btn-panel outline" style="padding: 8px 14px; font-size: 10px; color: var(--accent-red); border-color: var(--accent-red);" onclick="deletePlaylist('${pl.id}')">Delete</button>
            </div>
        `;
        root.appendChild(header);

        if (pl.tracks.length === 0) {
            const empty = document.createElement('div');
            empty.style.cssText = "text-align: center; padding: 40px 20px; font-size: 11px; font-style: italic; color: var(--ink-faded);";
            empty.innerText = "Playlist is empty. Tap '⋮' on any track to add songs here.";
            root.appendChild(empty);
            return;
        }

        pl.tracks.forEach((track, idx) => {
            const row = document.createElement('div');
            row.className = 'track-row-item';
            const thumbUrl = track.thumbnail || (track.id ? `https://img.youtube.com/vi/${track.id}/hqdefault.jpg` : '');

            row.innerHTML = `
                <div class="track-info-left" style="cursor: pointer;">
                    <span style="font-size: 10px; opacity: 0.4; font-weight: bold; width: 14px;">${idx + 1}</span>
                    ${thumbUrl ? `<img src="${thumbUrl}" class="track-thumb">` : ''}
                    <div class="track-text-group">
                        <div class="track-row-title">${track.title}</div>
                        <div class="track-row-artist">${track.artist}</div>
                    </div>
                </div>
                <div class="track-row-actions">
                    <button class="reorder-btn" onclick="movePlaylistItem('${pl.id}', ${idx}, -1)" ${idx === 0 ? 'disabled style="opacity:0.2"' : ''}>▲</button>
                    <button class="reorder-btn" onclick="movePlaylistItem('${pl.id}', ${idx}, 1)" ${idx === pl.tracks.length - 1 ? 'disabled style="opacity:0.2"' : ''}>▼</button>
                    <button class="icon-btn" onclick="removeSongFromPlaylist('${pl.id}', ${idx})" style="padding: 4px; color: var(--accent-red);" title="Remove">×</button>
                </div>
            `;
            row.querySelector('.track-info-left').onclick = () => playSingleFromPlaylist(pl.id, idx);
            root.appendChild(row);
        });
    }

    function openStarredDetailView() {
        const root = document.getElementById('drawer-content-root');
        root.innerHTML = '';

        const header = document.createElement('div');
        header.style.cssText = "border-bottom: 1px dashed var(--border); padding-bottom: 15px; margin-bottom: 20px;";
        header.innerHTML = `
            <button onclick="renderLibrary()" style="background: none; border: none; font-size: 11px; font-family: var(--font-mono); font-weight: bold; cursor: pointer; color: var(--ink-faded); text-transform: uppercase; margin-bottom: 10px;">
                ← Back to Library
            </button>
            <div style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 4px;">Starred Songs</div>
            <div style="font-size: 11px; opacity: 0.6; margin-bottom: 15px;">Your personal favorites collection.</div>
            
            <div style="display: flex; gap: 8px;">
                <button class="btn-panel" style="padding: 8px 14px; font-size: 10px;" onclick="playLikedCollection(false)">▶ Play All</button>
                <button class="btn-panel outline" style="padding: 8px 14px; font-size: 10px;" onclick="playLikedCollection(true)">🔀 Shuffle</button>
            </div>
        `;
        root.appendChild(header);

        if (likedSongs.length === 0) {
            root.innerHTML += `<div style="text-align: center; padding: 40px; color: var(--ink-faded); font-size: 11px; font-style: italic;">No starred songs yet.</div>`;
            return;
        }

        likedSongs.forEach((track, i) => {
            root.appendChild(createTrackRowElement(track, i, () => {
                currentQueue = [...likedSongs];
                playItemInQueue(i);
            }));
        });
    }

    function playEntirePlaylist(plId, shuffle = false) {
        const pl = customPlaylists.find(p => p.id === plId);
        if (!pl || pl.tracks.length === 0) return;

        currentQueue = [...pl.tracks];
        if (shuffle) {
            for (let i = currentQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQueue[i], currentQueue[j]] = [currentQueue[j], currentQueue[i]];
            }
        }
        playItemInQueue(0);
        closeDrawer();
    }

    function playSingleFromPlaylist(plId, index) {
        const pl = customPlaylists.find(p => p.id === plId);
        if (!pl) return;
        currentQueue = [...pl.tracks];
        playItemInQueue(index);
    }

    function playLikedCollection(shuffle = false) {
        if (likedSongs.length === 0) return;
        currentQueue = [...likedSongs];
        if (shuffle) {
            for (let i = currentQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentQueue[i], currentQueue[j]] = [currentQueue[j], currentQueue[i]];
            }
        }
        playItemInQueue(0);
        closeDrawer();
    }

    /* --- PLAYLIST REORDERING & DELETION --- */
    function movePlaylistItem(plId, index, direction) {
        const pl = customPlaylists.find(p => p.id === plId);
        if (!pl) return;

        const targetIdx = index + direction;
        if (targetIdx < 0 || targetIdx >= pl.tracks.length) return;

        const [movedTrack] = pl.tracks.splice(index, 1);
        pl.tracks.splice(targetIdx, 0, movedTrack);

        savePlaylists();
        openPlaylistDetailView(plId);
    }

    function removeSongFromPlaylist(plId, index) {
        const pl = customPlaylists.find(p => p.id === plId);
        if (!pl) return;

        pl.tracks.splice(index, 1);
        savePlaylists();
        openPlaylistDetailView(plId);
    }

    function deletePlaylist(plId) {
        if (confirm("Delete this entire playlist?")) {
            customPlaylists = customPlaylists.filter(p => p.id !== plId);
            savePlaylists();
            renderLibrary();
        }
    }

    /* --- PLAYLIST MODALS --- */
    function openCreatePlaylistModal() {
        editingPlaylistId = null;
        document.getElementById('pl-form-title').innerText = "New Playlist";
        document.getElementById('inp-pl-name').value = '';
        document.getElementById('inp-pl-desc').value = '';
        closePlaylistPicker();
        document.getElementById('playlist-form-modal').classList.add('open');
    }

    function openEditPlaylistModal(plId) {
        const pl = customPlaylists.find(p => p.id === plId);
        if (!pl) return;

        editingPlaylistId = plId;
        document.getElementById('pl-form-title').innerText = "Edit Playlist Info";
        document.getElementById('inp-pl-name').value = pl.name;
        document.getElementById('inp-pl-desc').value = pl.description || '';
        document.getElementById('playlist-form-modal').classList.add('open');
    }

    function closePlaylistFormModal() {
        document.getElementById('playlist-form-modal').classList.remove('open');
    }

    function submitPlaylistForm() {
        const name = document.getElementById('inp-pl-name').value.trim();
        const desc = document.getElementById('inp-pl-desc').value.trim();
        if (!name) return alert("Please enter a playlist title.");

        if (editingPlaylistId) {
            const pl = customPlaylists.find(p => p.id === editingPlaylistId);
            if (pl) {
                pl.name = name;
                pl.description = desc;
            }
        } else {
            const today = new Date();
            const dateStr = today.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const newPl = {
                id: 'pl_' + Date.now(),
                name: name,
                description: desc,
                createdDate: dateStr,
                tracks: activeModalTrack ? [activeModalTrack] : []
            };
            customPlaylists.unshift(newPl);
            if (activeModalTrack) alert(`Created playlist '${name}' and added track.`);
        }

        savePlaylists();
        closePlaylistFormModal();
        
        if (viewingPlaylistId) {
            openPlaylistDetailView(viewingPlaylistId);
        } else if (document.getElementById('drawer-overlay').classList.contains('open')) {
            renderLibrary();
        }
    }

    function openPlaylistPickerForActiveTrack() {
        if (!activeModalTrack) return;
        closeContextMenu();

        const pickerList = document.getElementById('playlist-picker-list');
        pickerList.innerHTML = '';

        if (customPlaylists.length === 0) {
            pickerList.innerHTML = `<div style="font-size: 11px; opacity: 0.5; text-align: center; padding: 15px;">No playlists found. Create one above!</div>`;
        } else {
            customPlaylists.forEach(pl => {
                const btn = document.createElement('button');
                btn.className = 'modal-option-btn';
                btn.innerHTML = `<span>${pl.name} (${pl.tracks.length})</span> <span>+</span>`;
                btn.onclick = () => addActiveTrackToPlaylist(pl.id);
                pickerList.appendChild(btn);
            });
        }

        document.getElementById('playlist-picker-modal').classList.add('open');
    }

    function closePlaylistPicker() {
        document.getElementById('playlist-picker-modal').classList.remove('open');
    }

    function addActiveTrackToPlaylist(plId) {
        const pl = customPlaylists.find(p => p.id === plId);
        if (!pl || !activeModalTrack) return;

        const alreadyExists = pl.tracks.some(t => t.title === activeModalTrack.title);
        if (alreadyExists && !confirm(`'${activeModalTrack.title}' is already in '${pl.name}'. Add again?`)) {
            closePlaylistPicker();
            return;
        }

        pl.tracks.push(activeModalTrack);
        savePlaylists();
        closePlaylistPicker();
        alert(`Added to '${pl.name}'!`);
    }

    function savePlaylists() {
        localStorage.setItem('sound_custom_playlists', JSON.stringify(customPlaylists));
    }

    /* --- HISTORY TAB --- */
    function renderHistory(container) {
        const root = container || document.getElementById('drawer-content-root');
        root.innerHTML = '';

        if (playHistory.length === 0) {
            root.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--ink-faded); font-size: 11px; font-style: italic;">History log empty. Played tracks appear here.</div>`;
            return;
        }

        root.innerHTML = `<div style="font-size: 10px; font-weight: bold; opacity: 0.5; margin-bottom: 15px; text-transform: uppercase;">Chronological Play History (${playHistory.length})</div>`;
        playHistory.forEach((track, i) => {
            root.appendChild(createTrackRowElement(track, i, () => {
                currentQueue = [track];
                playItemInQueue(0);
            }));
        });
    }

    /* --- ROBUST TRACK ROW COMPONENT BUILDER --- */
    function createTrackRowElement(track, index, playCallback, isActive = false, inQueueContext = false) {
        const div = document.createElement('div');
        div.className = 'track-row-item';
        if (isActive) div.style.background = 'var(--item-active)';

        const thumbUrl = track.thumbnail || (track.id ? `https://img.youtube.com/vi/${track.id}/hqdefault.jpg` : '');

        const leftDiv = document.createElement('div');
        leftDiv.className = 'track-info-left';
        leftDiv.innerHTML = `
            ${thumbUrl ? `<img src="${thumbUrl}" class="track-thumb">` : ''}
            <div class="track-text-group">
                <div class="track-row-title" style="${isActive ? 'color: var(--accent-gold);' : ''}">${track.title}</div>
                <div class="track-row-artist">${track.artist}</div>
            </div>
        `;
        leftDiv.onclick = playCallback;

        const rightDiv = document.createElement('div');
        rightDiv.className = 'track-row-actions';

        const menuBtn = document.createElement('button');
        menuBtn.className = 'icon-btn';
        menuBtn.style.cssText = 'padding: 6px; font-size: 16px;';
        menuBtn.innerText = '⋮';
        menuBtn.onclick = (e) => {
            e.stopPropagation();
            openContextMenu(track, index, inQueueContext);
        };

        rightDiv.appendChild(menuBtn);
        div.appendChild(leftDiv);
        div.appendChild(rightDiv);
        return div;
    }

    /* --- CONTEXT MENU ACTIONS --- */
    function openContextMenu(track, index, inQueueContext) {
        activeModalTrack = track;
        activeModalIndex = index;

        document.getElementById('modal-art').src = track.thumbnail || (track.id ? `https://img.youtube.com/vi/${track.id}/hqdefault.jpg` : '');
        document.getElementById('modal-title').innerText = track.title;
        document.getElementById('modal-artist').innerText = track.artist;

        const isLiked = likedSongs.some(s => s.title === track.title);
        document.getElementById('modal-like-text').innerText = isLiked ? "Remove from Starred Library" : "Save to Starred Library";

        const removeBtn = document.getElementById('modal-remove-btn');
        removeBtn.style.display = inQueueContext ? 'flex' : 'none';

        document.getElementById('context-modal').classList.add('open');
    }

    function closeContextMenu() {
        document.getElementById('context-modal').classList.remove('open');
    }

    function actionPlayNext() {
        if (!activeModalTrack) return;
        currentQueue.splice(currentQueueIndex + 1, 0, activeModalTrack);
        closeContextMenu();
        alert("Inserted as Next Track.");
    }

    function actionAddToQueue() {
        if (!activeModalTrack) return;
        currentQueue.push(activeModalTrack);
        closeContextMenu();
        alert("Appended to bottom of Queue.");
    }

    function actionToggleLikeModal() {
        if (!activeModalTrack) return;
        toggleLikeTrack(activeModalTrack);
        closeContextMenu();
    }

    function actionRemoveFromQueue() {
        if (activeModalIndex > -1 && activeModalIndex < currentQueue.length) {
            currentQueue.splice(activeModalIndex, 1);
            if (activeModalIndex < currentQueueIndex) currentQueueIndex--;
            renderActiveQueue();
            closeContextMenu();
        }
    }

    function actionCopyLink() {
        if (!activeModalTrack) return;
        const queryStr = `${activeModalTrack.title} ${activeModalTrack.artist}`;
        navigator.clipboard.writeText(queryStr);
        closeContextMenu();
        alert("Track Query Copied to Clipboard.");
    }

    /* --- STARRED & HISTORY ENGINES --- */
    function toggleLikeCurrent() {
        if (currentQueueIndex >= 0 && currentQueue[currentQueueIndex]) {
            toggleLikeTrack(currentQueue[currentQueueIndex]);
        }
    }

    function toggleLikeTrack(track) {
        const idx = likedSongs.findIndex(s => s.title === track.title);
        if (idx > -1) {
            likedSongs.splice(idx, 1);
        } else {
            likedSongs.unshift(track);
        }
        localStorage.setItem('sound_liked_tracks', JSON.stringify(likedSongs));
        updateHeaderLikeStatus();
    }

    function updateHeaderLikeStatus() {
        const activeTrack = currentQueue[currentQueueIndex];
        const btn = document.getElementById('header-like-btn');
        if (activeTrack && likedSongs.some(s => s.title === activeTrack.title)) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    }

    function addToHistory(track) {
        playHistory = playHistory.filter(s => s.title !== track.title);
        playHistory.unshift(track);
        if (playHistory.length > 50) playHistory.pop();
        localStorage.setItem('sound_play_history', JSON.stringify(playHistory));
    }

    /* --- EXPLICIT WINDOW ATTACHMENTS --- */
    window.openDrawerTab = openDrawerTab;
    window.closeDrawer = closeDrawer;
    window.switchDrawerTab = switchDrawerTab;
    window.executeSearch = executeSearch;
    window.togglePlay = togglePlay;
    window.playNext = playNext;
    window.playPrev = playPrev;
    window.toggleShuffle = toggleShuffle;
    window.toggleRepeat = toggleRepeat;
    window.toggleLikeCurrent = toggleLikeCurrent;
    window.toggleTheme = toggleTheme;
    window.seekTrack = seekTrack;
    window.clearQueue = clearQueue;
    window.openCreatePlaylistModal = openCreatePlaylistModal;
    window.openEditPlaylistModal = openEditPlaylistModal;
    window.closePlaylistFormModal = closePlaylistFormModal;
    window.submitPlaylistForm = submitPlaylistForm;
    window.openPlaylistPickerForActiveTrack = openPlaylistPickerForActiveTrack;
    window.closePlaylistPicker = closePlaylistPicker;
    window.closeContextMenu = closeContextMenu;
    window.actionPlayNext = actionPlayNext;
    window.actionAddToQueue = actionAddToQueue;
    window.actionToggleLikeModal = actionToggleLikeModal;
    window.actionRemoveFromQueue = actionRemoveFromQueue;
    window.actionCopyLink = actionCopyLink;
    window.playEntirePlaylist = playEntirePlaylist;
    window.playLikedCollection = playLikedCollection;
    window.deletePlaylist = deletePlaylist;
    window.renderLibrary = renderLibrary;
</script>
